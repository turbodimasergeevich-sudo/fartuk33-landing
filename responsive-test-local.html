<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Responsive test local</title>
<style>
  body{margin:0;padding:16px;background:#222;color:#fff;font-family:Arial,sans-serif}
  .row{margin-bottom:24px}
  .label{font-size:13px;margin-bottom:6px;color:#ffb28d}
  iframe{display:block;border:1px solid #666;background:#fff;height:780px}
</style>
</head>
<body>
  <div class="row"><div class="label">360 px</div><iframe src="file:///F:/siteDamir/index.html" style="width:360px"></iframe></div>
  <div class="row"><div class="label">390 px</div><iframe src="file:///F:/siteDamir/index.html" style="width:390px"></iframe></div>
  <div class="row"><div class="label">768 px</div><iframe src="file:///F:/siteDamir/index.html" style="width:768px"></iframe></div>
  <div class="row"><div class="label">1280 px</div><iframe src="file:///F:/siteDamir/index.html" style="width:1280px"></iframe></div>
  <script>
    window.addEventListener('load', () => setTimeout(() => {
      document.querySelectorAll('iframe').forEach(f => {
        try {
          f.contentDocument.querySelectorAll('.reveal').forEach(e => e.classList.add('is-visible'));
        } catch (e) {}
      });
    }, 1200));
  </script>
</body>
</html>
