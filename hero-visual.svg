<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161A1F"/>
      <stop offset="1" stop-color="#20262E"/>
    </linearGradient>
    <radialGradient id="glowOrange" cx="30%" cy="30%" r="60%">
      <stop offset="0" stop-color="#D9683C" stop-opacity=".45"/>
      <stop offset="1" stop-color="#D9683C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="75%" cy="65%" r="55%">
      <stop offset="0" stop-color="#2F6B5F" stop-opacity=".40"/>
      <stop offset="1" stop-color="#2F6B5F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CFC9BD"/>
      <stop offset=".45" stop-color="#B7B0A3"/>
      <stop offset="1" stop-color="#9E978B"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E6A63"/>
      <stop offset=".5" stop-color="#3C4147"/>
      <stop offset="1" stop-color="#20262E"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2DCD0"/>
      <stop offset="1" stop-color="#A8A196"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="34" stdDeviation="26" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="veins" width="160" height="160" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <path d="M-20 40 C 40 10, 90 70, 180 30" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>
      <path d="M-10 110 C 60 80, 100 140, 180 100" fill="none" stroke="#5B574F" stroke-opacity=".18" stroke-width="1.5"/>
      <path d="M30 -10 C 70 50, 30 100, 80 180" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="1.5"/>
      <circle cx="120" cy="60" r="2" fill="#6B665E" fill-opacity=".25"/>
      <circle cx="50" cy="130" r="1.5" fill="#fff" fill-opacity=".3"/>
    </pattern>
  </defs>

  <rect width="900" height="700" rx="24" fill="url(#bg)"/>
  <ellipse cx="250" cy="220" rx="330" ry="260" fill="url(#glowOrange)"/>
  <ellipse cx="700" cy="500" rx="300" ry="240" fill="url(#glowGreen)"/>

  <!-- floor reflection -->
  <ellipse cx="455" cy="600" rx="280" ry="38" fill="#000" opacity=".5" filter="url(#soft)"/>

  <g filter="url(#shadow)">
    <!-- right edge: 6 mm -->
    <polygon points="680,80 712,64 742,504 710,520" fill="url(#edge)"/>
    <!-- top edge -->
    <polygon points="170,130 202,114 712,64 680,80" fill="url(#top)"/>
    <!-- front face -->
    <polygon points="170,130 680,80 710,520 200,570" fill="url(#front)"/>
    <polygon points="170,130 680,80 710,520 200,570" fill="url(#veins)"/>
    <!-- subtle grid -->
    <g stroke="#fff" stroke-opacity=".10" stroke-width="1">
      <path d="M340 117 L370 557"/>
      <path d="M510 99 L540 539"/>
      <path d="M183 270 L693 220"/>
      <path d="M191 420 L701 370"/>
    </g>
    <!-- edge highlight -->
    <polygon points="680,80 712,64 742,504 710,520" fill="none" stroke="#D9683C" stroke-opacity=".55" stroke-width="2"/>
    <polygon points="170,130 680,80 710,520 200,570" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5"/>
  </g>

  <!-- callout line -->
  <path d="M712 64 L800 40 L846 40" fill="none" stroke="#D9683C" stroke-width="2" stroke-opacity=".9"/>
  <circle cx="712" cy="64" r="5" fill="#D9683C"/>
</svg>
